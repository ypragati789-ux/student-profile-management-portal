<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Profile Management Portal</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
<h1>🎓 Student Profile Management</h1>
<p>Live API Project | By Pragati</p>
</header>
<nav>
<button onclick="showSection('dashboard')">📊 Dashboard</button>
<button onclick="showSection('students')">👨‍🎓 Students</button>
<button onclick="fetchStudents()">🔄 Refresh API</button>
</nav>

<section id="dashboard" class="section">
<div class="stats">
<div class="card"><h2 id="totalCount">0</h2><p>Total Students</p></div>
<div class="card"><h2 id="avgAge">0</h2><p>Average Age</p></div>
<div class="card"><h2>✅ LIVE</h2><p>API Connected</p></div>
</div>
<h3 style="margin-top:20px">Welcome! Go to Students tab to see data from API.</h3>
</section>

<section id="students" class="section hidden">
<div class="toolbar">
<input type="text" id="searchInput" placeholder="Search by name or email..." onkeyup="searchStudents()">
<button onclick="openAddModal()" style="background:#263238;color:white;padding:8px 14px;border:none;border-radius:6px">+ Add Student</button>
</div>
<p id="loader">Loading students from API...</p>
<table>
<thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Age</th><th>Dept</th><th>Actions</th></tr></thead>
<tbody id="studentBody"></tbody>
</table>
</section>

<section id="profile" class="section hidden">
<button onclick="showSection('students')">← Back to Students</button>
<div id="profileCard" style="margin-top:20px;background:white;padding:20px;border-radius:10px"></div>
</section>

<div id="addModal" class="modal hidden">
<div class="modal-content">
<h3>Add New Student</h3>
<input id="newName" placeholder="Full Name">
<input id="newEmail" placeholder="Email">
<input id="newAge" type="number" placeholder="Age">
<input id="newCourse" placeholder="Course / Dept">
<button onclick="addStudent()" style="background:#263238;color:white;padding:10px;border:none;border-radius:6px">Save Student</button>
<button onclick="closeAddModal()" style="background:#eee;padding:10px;border:none;border-radius:6px">Cancel</button>
</div>
</div>

<script src="script.js"></script>
</body>
</html>
